# Keeps the extracted Bloxd.io data in sync with the live game.
# Primary trigger: the external Cloudflare Worker polls once per minute and
# dispatches this workflow only when the live bundle URL differs from update-state.json.
# GitHub's own schedule is retained as a low-frequency six-hour fallback.
name: Update Bloxd data

on:
  schedule:
    - cron: '13 */6 * * *'
  repository_dispatch:
    types: [bloxd-build-changed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bloxd-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate update script
        run: node --check update.js

      - name: Run update.js
        run: node update.js
        env:
          BLOXD_UPDATE_OUT: ${{ runner.temp }}/bloxd-update-summary.json

      - name: Commit and push
        id: push
        env:
          BLOXD_SUMMARY: ${{ runner.temp }}/bloxd-update-summary.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HASH=$(node -p "JSON.parse(require('fs').readFileSync(process.env.BLOXD_SUMMARY, 'utf8')).bundle.hash8 || 'unknown'")
          CHANGED=$(node -p "const s = JSON.parse(require('fs').readFileSync(process.env.BLOXD_SUMMARY, 'utf8')); (s.firstRun || s.added || s.removed || s.idChanged || s.entryFilesChanged) ? '1' : '0'")
          BUNDLE_CHANGED=$(node -p "JSON.parse(require('fs').readFileSync(process.env.BLOXD_SUMMARY, 'utf8')).bundleChanged ? '1' : '0'")

          git add -A
          if [ "$CHANGED" = "1" ]; then
            git commit -m "Update Bloxd entries data (bundle $HASH)"
          elif [ "$BUNDLE_CHANGED" = "1" ]; then
            git commit -m "Refresh bundle references (bundle $HASH)"
          else
            git commit -m "Refresh extracted metadata (bundle $HASH)"
          fi

          git push origin main
          echo "did_commit=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Notify Discord (update shipped)
        if: success() && steps.push.outputs.did_commit == 'true'
        env:
          BLOXD_SUMMARY: ${{ runner.temp }}/bloxd-update-summary.json
          COMMIT_SHA: ${{ steps.push.outputs.commit_sha }}
          REPO: ${{ github.repository }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAYLOAD: ${{ runner.temp }}/bloxd-payload.json
        run: |
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(process.env.BLOXD_SUMMARY, "utf8"));
            const b = s.bundle || {};
            const hash = b.hash8 || "unknown";
            const commitUrl = "https://github.com/" + process.env.REPO + "/commit/" + process.env.COMMIT_SHA;
            const links = [b.url ? "[バンドル](" + b.url + ")" : "", "[コミット](" + commitUrl + ")"].filter(Boolean).join(" · ");
            let title;
            let lines;
            let color = 0x57f287;
            if (s.firstRun) {
              title = "データ初期登録";
              lines = [s.nextCount + "件", links];
            } else if (s.added || s.removed || s.idChanged) {
              title = "エントリ更新";
              lines = [s.prevCount + " → " + s.nextCount + "件", "追加 " + s.added + " · 削除 " + s.removed + " · ID変更 " + s.idChanged, links];
            } else if (s.entryFilesChanged) {
              title = "プロパティ更新";
              lines = [s.nextCount + "件 · プロパティ変更 " + s.entryFilesChanged + "ファイル", links];
              color = 0xfee75c;
            } else if (s.bundleChanged) {
              title = "バンドル更新";
              lines = [hash + " · " + s.nextCount + "件（データ変更なし）", links];
              color = 0xfee75c;
            } else {
              title = "データ確認";
              lines = [s.nextCount + "件（変更なし）", links];
              color = 0xfee75c;
            }
            const embed = { title, description: lines.filter(Boolean).join("\n"), color };
            fs.writeFileSync(process.env.PAYLOAD, JSON.stringify({ username: "Bloxd Data Bot", embeds: [embed] }));
          '
          if [ -n "$WEBHOOK" ]; then
            curl -sS --fail -H "Content-Type: application/json" -d @"$PAYLOAD" "$WEBHOOK" > /dev/null
          else
            echo "DISCORD_WEBHOOK_URL secret is not set; notification skipped"
          fi
      - name: Notify Discord (update failed)
        if: failure()
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAYLOAD: ${{ runner.temp }}/bloxd-fail-payload.json
        run: |
          node -e '
            const fs = require("fs");
            const payload = {
              username: "Bloxd Data Bot",
              embeds: [{
                title: "更新失敗",
                description: "[実行ログ](" + process.env.RUN_URL + ")",
                color: 0xed4245,
                url: process.env.RUN_URL,
              }],
            };
            fs.writeFileSync(process.env.PAYLOAD, JSON.stringify(payload));
          '
          if [ -n "$WEBHOOK" ]; then
            curl -sS --fail -H "Content-Type: application/json" -d @"$PAYLOAD" "$WEBHOOK" > /dev/null || true
          else
            echo "DISCORD_WEBHOOK_URL secret is not set; notification skipped"
          fi
