# Keeps the extracted Bloxd.io data in sync with the live game.
# Primary trigger: the external Cloudflare Worker polls once per minute and
# dispatches this workflow only when the live bundle URL differs from update-state.json.
# GitHub's own schedule is retained as a low-frequency six-hour fallback.
name: Update Bloxd data

on:
  schedule:
    - cron: '13 */6 * * *'
  repository_dispatch:
    types: [bloxd-build-changed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bloxd-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          # Node 20 is EOL (April 2026); 24 is the active LTS and matches the
          # environment update.js is developed against. The script stays Node >= 18
          # compatible regardless.
          node-version: 24

      - name: Validate update script
        run: node --check update.js

      - name: Run update.js
        run: node update.js
        env:
          BLOXD_UPDATE_OUT: ${{ runner.temp }}/bloxd-update-summary.json

      - name: Commit and push
        id: push
        env:
          BLOXD_SUMMARY: ${{ runner.temp }}/bloxd-update-summary.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HASH=$(node -p "JSON.parse(require('fs').readFileSync(process.env.BLOXD_SUMMARY, 'utf8')).bundle.hash8 || 'unknown'")
          CHANGED=$(node -p "const s = JSON.parse(require('fs').readFileSync(process.env.BLOXD_SUMMARY, 'utf8')); (s.firstRun || s.added || s.removed || s.idChanged || s.entryFilesChanged) ? '1' : '0'")
          BUNDLE_CHANGED=$(node -p "JSON.parse(require('fs').readFileSync(process.env.BLOXD_SUMMARY, 'utf8')).bundleChanged ? '1' : '0'")

          git add -A
          if [ "$CHANGED" = "1" ]; then
            git commit -m "Update Bloxd entries data (bundle $HASH)"
          elif [ "$BUNDLE_CHANGED" = "1" ]; then
            git commit -m "Refresh bundle references (bundle $HASH)"
          else
            git commit -m "Refresh extracted metadata (bundle $HASH)"
          fi

          git push origin main
          echo "did_commit=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Discord delivery is centralized in the Cloudflare Worker, which polls
      # the committed update-state.json and routes data diffs to Entries webhook.
